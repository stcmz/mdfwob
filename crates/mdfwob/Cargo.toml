[package]
name = "mdfwob"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
description = "Download historical market data from IBKR and Databento into FWOB files"
keywords = ["market-data", "ibkr", "databento", "finance", "fwob"]
categories = ["command-line-utilities"]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["mcp"]
# `mdfwob mcp`: a read-only Model Context Protocol server on stdio. On by default so
# `cargo install mdfwob` ships it; library consumers can opt out with
# `default-features = false`.
mcp = ["dep:base64", "dep:rmcp", "dep:schemars", "tokio/io-std", "tokio/macros"]

[dependencies]
mdfwob-core = { version = "1.15.0", path = "../mdfwob-core" }
anyhow = "1.0"
# Only for encoding chart PNGs into MCP image content blocks.
base64 = { version = "0.23", optional = true }
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5"
databento = "0.55.0"
fs2 = "0.4"
fwob = "1.14"
fwob-core = "1.14"
fwob-v1 = "1.14"
fwob-v2 = "1.14"
ibapi = { version = "3.1.0", default-features = false, features = ["sync"] }
jiff = "0.2"
# rmcp's MSRV sits exactly on this workspace's floor (1.88 as of 3.2), so a release that
# raises it breaks us immediately. Despite the wording this once carried, `"3.1"` is `^3.1` --
# any 3.x -- not a pin. The real guard is the `Rust 1.88` CI job, which checks the locked
# graph at the floor and fails before such a bump can ship.
rmcp = { version = "3.1", optional = true, default-features = false, features = [
    "server",
    "macros",
    "transport-io",
] }
# Kept in the same semver range rmcp depends on, so the two unify on one version.
schemars = { version = "1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
